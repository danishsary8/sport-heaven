name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The build fails if the test sign-in is bundled or the first-load JavaScript is over budget.
      - run: npm run build

  e2e:
    name: End-to-end (real backend)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: sport-heaven
      # The backend lives in its own repository. A private repository needs a read token in BACKEND_REPO_TOKEN.
      - uses: actions/checkout@v4
        with:
          repository: danishsary8/sport-backend
          ref: ${{ github.head_ref || github.ref_name }}
          path: sport-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: sport-backend
      - run: npm ci
        working-directory: sport-heaven
      - run: npx playwright install --with-deps chromium
        working-directory: sport-heaven
      - run: npx playwright test --trace off
        working-directory: sport-heaven
        env:
          CI: 'true'
          BACKEND_DIR: ../sport-backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sport-heaven/playwright-report
          retention-days: 7
